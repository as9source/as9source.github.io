<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="外構工事に便利な計算ツール集 - カーポート、テラス屋根、躯体採寸など">
    
    <!-- キャッシュ対策 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <!-- PWA設定 -->
    <link rel="apple-touch-icon" href="icon-192.svg">
    <link rel="icon" type="image/svg+xml" href="icon-192.svg">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e3a8a">
    
    <!-- Font Awesome -->
    <!-- アイコンは Font Awesome Free 6.5.1 のSVGをインライン化している。
         Icons: CC BY 4.0 / https://fontawesome.com/license/free
         CDNからのCSS読み込みをやめ、外部依存とオフライン時のアイコン欠落をなくしている。 -->
    
    <title>エクステリア計算ツール</title>
    <style>
        /* Version 2.0 - 2024-12-28 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            min-height: 100vh;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* 背景の装飾 */
        body::before {
            content: '';
            position: absolute;
            top: 100px;
            left: 80px;
            width: 150px;
            height: 150px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            transform: rotate(25deg);
        }

        body::after {
            content: '';
            position: absolute;
            bottom: 200px;
            right: 100px;
            width: 180px;
            height: 180px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* ヘッダーカード */
        .header-card {
            background: rgba(30, 64, 175, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 80px 40px;
            text-align: center;
            margin-bottom: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 2.5rem;
            color: white;
            margin-bottom: 15px;
            font-weight: 600;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.8);
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 300;
        }

        .description {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1rem;
            margin-top: 40px;
            line-height: 1.8;
        }

        /* ツールカード */
        .tools-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .tool-card {
            background: white;
            border-radius: 25px;
            padding: 35px;
            display: flex;
            align-items: center;
            gap: 25px;
            text-decoration: none;
            color: inherit;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            transition: all 0.3s ease;
            position: relative;
        }

        .tool-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.25);
        }

        .tool-card.new {
            border: 3px solid #f59e0b;
            background: white;
        }

        .tool-icon-wrapper {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .tool-icon-wrapper .tool-icon {
            height: 2rem;
            width: auto;
            max-width: 2.5rem;
            color: #2563eb;
        }

        .tool-content {
            flex: 1;
        }

        .tool-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 8px;
        }

        .new-badge {
            display: inline-block;
            background: #f59e0b;
            color: white;
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-left: 10px;
            vertical-align: middle;
        }

        .tool-description {
            font-size: 0.95rem;
            color: #6b7280;
            line-height: 1.6;
        }

        .tool-button {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: white;
            padding: 14px 32px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            flex-shrink: 0;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
            transition: all 0.3s ease;
        }

        .tool-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
        }

        footer {
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
            margin-top: 60px;
        }

        @media (max-width: 768px) {
            body::before,
            body::after {
                display: none;
            }

            h1 {
                font-size: 2rem;
            }

            .header-card {
                padding: 60px 30px;
            }

            .tool-card {
                flex-direction: column;
                text-align: center;
                padding: 30px;
            }

            .tool-icon-wrapper {
                width: 70px;
                height: 70px;
            }

            .tool-icon-wrapper .tool-icon {
                height: 1.8rem;
                max-width: 2.25rem;
            }

            .tool-button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-card">
            <h1>エクステリア計算ツール</h1>
            <p class="subtitle">Exterior Calculator</p>
            <p class="description">カーポートやテラス屋根など、外構工事に便利な計算ツール集です。</p>
        </div>

        <div class="tools-grid">

                </div>
                <button class="tool-button">開く</button>

                </div>
                <div class="tool-content">

                </div>
                <button class="tool-button">開く</button>
            </a>

            <a href="./Carport-Post-Calculation/conc.html" class="tool-card">
                <div class="tool-icon-wrapper">
                    <svg class="tool-icon" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true" focusable="false"><path fill="currentColor" d="M234.5 5.7c13.9-5 29.1-5 43.1 0l192 68.6C495 83.4 512 107.5 512 134.6V377.4c0 27-17 51.2-42.5 60.3l-192 68.6c-13.9 5-29.1 5-43.1 0l-192-68.6C17 428.6 0 404.5 0 377.4V134.6c0-27 17-51.2 42.5-60.3l192-68.6zM256 66L82.3 128 256 190l173.7-62L256 66zm32 368.6l160-57.1v-188L288 246.6v188z"/></svg>
                </div>

                    <p class="tool-description">カーポート柱のコンクリート必要量を自動計算します。</p>
                </div>
                <button class="tool-button">開く</button>
            </a>

            <a href="https://as9source.github.io/angle/" class="tool-card">

                    <svg class="tool-icon" viewBox="0 0 576 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true" focusable="false"><path fill="currentColor" d="M575.8 255.5c0 18-15 32.1-32 32.1h-32l.7 160.2c0 2.7-.2 5.4-.5 8.1V472c0 22.1-17.9 40-40 40H456c-1.1 0-2.2 0-3.3-.1c-1.4 .1-2.8 .1-4.2 .1H416 392c-22.1 0-40-17.9-40-40V448 384c0-17.7-14.3-32-32-32H256c-17.7 0-32 14.3-32 32v64 24c0 22.1-17.9 40-40 40H160 128.1c-1.5 0-3-.1-4.5-.2c-1.2 .1-2.4 .2-3.6 .2H104c-22.1 0-40-17.9-40-40V360c0-.9 0-1.9 .1-2.8V287.6H32c-18 0-32-14-32-32.1c0-9 3-17 10-24L266.4 8c7-7 15-8 22-8s15 2 21 7L564.8 231.5c8 7 12 15 11 24z"/></svg>
                </div>
                <div class="tool-content">
                    <h2 class="tool-title">テラス屋根 干渉チェック</h2>
                    <p class="tool-description">母屋の屋根とテラス屋根の干渉を計算でチェックします。</p>
                </div>
                <button class="tool-button">開く</button>
            </a>

            <a href="https://as9source.github.io/triangle/" class="tool-card">
                <div class="tool-icon-wrapper">
                    <svg class="tool-icon" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true" focusable="false"><path fill="currentColor" d="M352 96c0 14.3-3.1 27.9-8.8 40.2L396 227.4c-23.7 25.3-54.2 44.1-88.5 53.6L256 192h0 0l-68 117.5c21.5 6.8 44.3 10.5 68.1 10.5c70.7 0 133.8-32.7 174.9-84c11.1-13.8 31.2-16 45-5s16 31.2 5 45C428.1 341.8 347 384 256 384c-35.4 0-69.4-6.4-100.7-18.1L98.7 463.7C94 471.8 87 478.4 78.6 482.6L23.2 510.3c-5 2.5-10.9 2.2-15.6-.7S0 501.5 0 496V440.6c0-8.4 2.2-16.7 6.5-24.1l60-103.7C53.7 301.6 41.8 289.3 31.2 276c-11.1-13.8-8.8-33.9 5-45s33.9-8.8 45 5c5.7 7.1 11.8 13.8 18.2 20.1l69.4-119.9c-5.6-12.2-8.8-25.8-8.8-40.2c0-53 43-96 96-96s96 43 96 96zm21 297.9c32.6-12.8 62.5-30.8 88.9-52.9l43.7 75.5c4.2 7.3 6.5 15.6 6.5 24.1V496c0 5.5-2.9 10.7-7.6 13.6s-10.6 3.2-15.6 .7l-55.4-27.7c-8.4-4.2-15.4-10.8-20.1-18.9L373 393.9zM256 128a32 32 0 1 0 0-64 32 32 0 1 0 0 64z"/></svg>
                </div>
                <div class="tool-content">
                    <h2 class="tool-title">三角形計算機</h2>
                    <p class="tool-description">直角三角形の斜辺や高さを簡単に計算できます。</p>
                </div>
                <button class="tool-button">開く</button>
            </a>
        </div>

        <footer>
            © as9source — Exterior Tools
        </footer>
    </div>
</body>
</html>
